# Reverse Proxy 라우팅 규칙. 한 줄에 규칙 하나: 경로 접두사, 그 뒤에 백엔드 주소:포트를 하나 이상.
# 백엔드가 여러 개면 요청마다 차례대로 돌아가며 보낸다 (라운드로빈). 위에 적힌 규칙이 먼저 적용된다.
/api/    127.0.0.1:8001 127.0.0.1:8003
/static/ 127.0.0.1:8002

# 응답 캐싱: 이 접두사로 시작하는 경로의 GET 응답(200)을 프록시의 메모리에 10초 동안 두고 다시 쓴다.
# /api/ 는 넣지 않았다. 캐시에 있으면 백엔드에 가지 않으므로 라운드로빈이 보이지 않는다.
cache /static/
