<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-label="클라이언트 세 개가 TCP 연결 1로 서버 컴퓨터의 Reverse Proxy 8080 포트에 연결되고, Reverse Proxy가 TCP 연결 2로 웹 서버 9000 포트에 연결되며, 웹 서버가 파일 시스템에서 파일을 읽는 구성도" xmlns:c2pa="http://c2pa.org/manifest">
<rect width="100%" height="100%" fill="#ffffff"/>
<style>
text{font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;fill:#18272b}
.mono{font-family:Consolas,"DejaVu Sans Mono",monospace}
.muted{fill:#56686c}.c{fill:#0f7c78}.s{fill:#a8650c}.p{fill:#5b5fa8}
.box-c{fill:#dcefed;stroke:#0f7c78;stroke-width:1.5}
.box-s{fill:#f6e8d3;stroke:#a8650c;stroke-width:1.5}
.box-p{fill:#e5e6f5;stroke:#5b5fa8;stroke-width:1.5}
.bldg{fill:none;stroke:#c9d5d3;stroke-width:2}
.ln{stroke:#56686c;stroke-width:1.5;fill:none}
.ln-c{stroke:#0f7c78;stroke-width:2;fill:none}.ln-s{stroke:#a8650c;stroke-width:2;fill:none}.ln-p{stroke:#5b5fa8;stroke-width:2;fill:none}
.life{stroke:#c9d5d3;stroke-width:2;stroke-dasharray:5 6}
.ah-c{fill:#0f7c78}.ah-s{fill:#a8650c}.ah-p{fill:#5b5fa8}.ah-m{fill:#56686c}
</style>
      <defs>
        <marker id="aC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah-c"/></marker>
        <marker id="aP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah-p"/></marker>
        <marker id="aS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah-s"/></marker>
      </defs>
      <!-- clients -->
      <text x="90" y="40" text-anchor="middle" font-weight="700" class="c">클라이언트</text>
      <rect x="30" y="80" width="120" height="44" rx="22" class="box-c"/><text x="90" y="107" text-anchor="middle" font-size="14">브라우저</text>
      <rect x="30" y="160" width="120" height="44" rx="22" class="box-c"/><text x="90" y="187" text-anchor="middle" font-size="14" class="mono">curl</text>
      <rect x="30" y="240" width="120" height="44" rx="22" class="box-c"/><text x="90" y="267" text-anchor="middle" font-size="14">브라우저</text>
      <text x="90" y="314" text-anchor="middle" font-size="13" class="muted">동시에 여러 요청</text>
      <text x="90" y="332" text-anchor="middle" font-size="13" class="muted">→ 동시성 (학습 4)</text>
      <!-- connection 1 -->
      <path d="M150,102 C220,102 250,185 326,188" class="ln-c" marker-end="url(#aC)"/>
      <path d="M150,182 C230,182 260,190 326,190" class="ln-c" marker-end="url(#aC)"/>
      <path d="M150,262 C220,262 250,195 326,192" class="ln-c" marker-end="url(#aC)"/>
      <text x="238" y="142" text-anchor="middle" font-size="13" font-weight="700" class="c">TCP 연결 ①</text>
      <rect x="182" y="222" width="110" height="40" rx="4" class="box-c"/>
      <text x="237" y="239" text-anchor="middle" font-size="12">주고받는 내용</text>
      <text x="237" y="255" text-anchor="middle" font-size="12" font-weight="700">HTTP 요청·응답</text>
      <!-- host -->
      <rect x="306" y="56" width="574" height="284" rx="6" class="bldg"/>
      <text x="320" y="44" font-size="14" font-weight="700">서버 컴퓨터</text>
      <text x="410" y="44" font-size="13" class="muted mono">IP 주소 127.0.0.1 (localhost)</text>
      <!-- reverse proxy -->
      <rect x="330" y="120" width="200" height="140" rx="8" class="box-p"/>
      <text x="430" y="150" text-anchor="middle" font-size="15" font-weight="700">Reverse Proxy</text>
      <text x="430" y="170" text-anchor="middle" font-size="12" class="muted">프로세스 1</text>
      <text x="430" y="196" text-anchor="middle" font-size="13" class="mono p">포트 8080에서 listen</text>
      <text x="430" y="220" text-anchor="middle" font-size="12" class="muted">연결 ①에서는 서버</text>
      <text x="430" y="238" text-anchor="middle" font-size="12" class="muted">연결 ②에서는 클라이언트</text>
      <!-- connection 2 -->
      <path d="M530,190 L616,190" class="ln-p" marker-end="url(#aP)"/>
      <text x="573" y="180" text-anchor="middle" font-size="12" font-weight="700" class="p">TCP 연결 ②</text>
      <text x="573" y="210" text-anchor="middle" font-size="11" class="muted mono">connect</text>
      <!-- web server -->
      <rect x="620" y="80" width="240" height="170" rx="8" class="box-s"/>
      <text x="740" y="110" text-anchor="middle" font-size="15" font-weight="700">웹 서버</text>
      <text x="740" y="130" text-anchor="middle" font-size="12" class="muted">프로세스 2</text>
      <text x="740" y="156" text-anchor="middle" font-size="13" class="mono s">포트 9000에서 listen</text>
      <text x="740" y="182" text-anchor="middle" font-size="12">요청 읽기 → 파싱 → 응답 생성</text>
      <text x="740" y="230" text-anchor="middle" font-size="12" class="muted">로드맵 단계 1~6</text>
      <text x="430" y="290" text-anchor="middle" font-size="12" class="muted">로드맵 단계 7·8</text>
      <!-- file system -->
      <rect x="650" y="278" width="180" height="48" rx="6" class="bldg"/>
      <text x="740" y="298" text-anchor="middle" font-size="13" font-weight="700">파일 시스템</text>
      <text x="740" y="316" text-anchor="middle" font-size="11" class="mono muted">index.html, logo.png</text>
      <path d="M740,250 L740,274" class="ln-s" marker-end="url(#aS)"/>
      <text x="750" y="267" font-size="11" class="muted mono">open·read</text>
    <metadata><c2pa:manifest></c2pa:manifest></metadata></svg>