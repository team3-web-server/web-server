<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif"><title>장면 4 백엔드 하나가 죽어도 계속 보냄</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d64545"/></marker></defs><rect width="600" height="400" fill="#ffffff"/><text x="300" y="32" text-anchor="middle" font-size="19" fill="#222222" xml:space="preserve" font-weight="700">④ 백엔드 하나가 죽어도 계속 보냄</text><text x="300" y="56" text-anchor="middle" font-size="13" fill="#555555" xml:space="preserve">두 백엔드에 차례대로 보내는데 A가 꺼졌다면</text><rect x="10" y="70" width="580" height="320" rx="12" fill="#fafafa" stroke="#cccccc"/><rect x="30" y="175" width="130" height="80" rx="9" fill="#e8eef8" stroke="#5b7bb0" stroke-width="1.8"/><text x="95.0" y="220.0" text-anchor="middle" font-size="14" fill="#222222" xml:space="preserve" font-weight="700">클라이언트</text><rect x="230" y="175" width="130" height="80" rx="9" fill="#fff4d6" stroke="#c99a2e" stroke-width="1.8"/><text x="295.0" y="211.0" text-anchor="middle" font-size="14" fill="#222222" xml:space="preserve" font-weight="700">프록시</text><text x="295.0" y="230.0" text-anchor="middle" font-size="12" fill="#555555" xml:space="preserve">A, B 번갈아</text><rect x="430" y="105" width="130" height="80" rx="9" fill="#fdecec" stroke="#d64545" stroke-width="1.8"/><text x="495.0" y="141.0" text-anchor="middle" font-size="14" fill="#222222" xml:space="preserve" font-weight="700">백엔드 A</text><text x="495.0" y="160.0" text-anchor="middle" font-size="12" fill="#555555" xml:space="preserve">꺼짐</text><rect x="430" y="255" width="130" height="80" rx="9" fill="#e6f4ea" stroke="#4a9564" stroke-width="1.8"/><text x="495.0" y="291.0" text-anchor="middle" font-size="14" fill="#222222" xml:space="preserve" font-weight="700">백엔드 B</text><text x="495.0" y="310.0" text-anchor="middle" font-size="12" fill="#555555" xml:space="preserve">정상</text><path d="M160,215 L228,215" stroke="#444444" stroke-width="1.8" fill="none" marker-end="url(#a)"/><path d="M360,195 L428,150" stroke="#d64545" stroke-width="1.8" fill="none" marker-end="url(#r)" stroke-dasharray="6 5"/><path d="M360,235 L428,290" stroke="#444444" stroke-width="1.8" fill="none" marker-end="url(#a)"/><text x="380" y="150" text-anchor="middle" font-size="12" fill="#d64545" xml:space="preserve">홀수 번째</text><text x="375" y="297" text-anchor="middle" font-size="12" fill="#555555" xml:space="preserve">짝수 번째</text><text x="300" y="370" text-anchor="middle" font-size="15" fill="#d64545" xml:space="preserve" font-weight="700">✗ 두 번에 한 번은 502 Bad Gateway</text></svg>
