<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 466" width="900" height="466" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif"><title>프록시에 요청을 보내 라운드로빈, 캐시, 헬스 체크를 확인한 실제 출력</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d64545"/></marker></defs><rect width="900" height="466" fill="#ffffff"/><rect x="10" y="10" width="880" height="446" rx="10" fill="#14201f"/><circle cx="32" cy="29" r="6" fill="#e5675f"/><circle cx="52" cy="29" r="6" fill="#e5b95f"/><circle cx="72" cy="29" r="6" fill="#6fcf6f"/><text x="30" y="64" text-anchor="start" font-size="14" fill="#7fd6cf" xml:space="preserve" font-family="Consolas,DejaVu Sans Mono,monospace">$ curl -s http://localhost:8080/api/</text><text x="30" y="86" text-anchor="start" font-size="14" fill="#d8e2e0" xml:space="preserve" font-family="Consolas,DejaVu Sans Mono,monospace">백엔드 8001이 보낸 /api/ 응답</text><text x="30" y="108" text-anchor="start" font-size="14" fill="#7fd6cf" xml:space="preserve" font-family="Consolas,DejaVu Sans Mono,monospace">$ curl -s http://localhost:8080/api/</text><text x="30" y="130" text-anchor="start" font-size="14" fill="#d8e2e0" xml:space="preserve" font-family="Consolas,DejaVu Sans Mono,monospace">백엔드 8003이 보낸 /api/ 응답</text><text x="30" y="152" text-anchor="start" font-size="14" fill="#7fd6cf" xml:space="preserve" font-family="Consolas,DejaVu Sans Mono,monospace">$ curl -s http://localhost:8080/static/     # 두 번 실행</text><text x="30" y="174" text-anchor="start" font-size="14" fill="#d8e2e0" xml:space="preserve" font-family="Consolas,DejaVu Sans Mono,monospace">백엔드 8002가 보낸 /static/ 응답</text><text x="30" y="218" text-anchor="start" font-size="14" fill="#8da3a0" xml:space="preserve" font-family="Consolas,DejaVu Sans Mono,monospace"># 프록시 터미널의 출력 (일부)</text><text x="30" y="240" text-anchor="start" font-size="14" fill="#e5c07b" xml:space="preserve" font-family="Consolas,DejaVu Sans Mono,monospace">[Reverse] GET /api/ → 127.0.0.1:8001</text><text x="30" y="262" text-anchor="start" font-size="14" fill="#e5c07b" xml:space="preserve" font-family="Consolas,DejaVu Sans Mono,monospace">[Reverse] GET /api/ → 127.0.0.1:8003</text><text x="30" y="284" text-anchor="start" font-size="14" fill="#e5c07b" xml:space="preserve" font-family="Consolas,DejaVu Sans Mono,monospace">[Cache] MISS /static/</text><text x="30" y="306" text-anchor="start" font-size="14" fill="#e5c07b" xml:space="preserve" font-family="Consolas,DejaVu Sans Mono,monospace">[Cache] 저장 /static/ 144바이트 (물어본 때부터 10초 동안 씀)</text><text x="30" y="328" text-anchor="start" font-size="14" fill="#e5c07b" xml:space="preserve" font-family="Consolas,DejaVu Sans Mono,monospace">[Cache] HIT /static/ → 사본 144바이트를 보냄 (백엔드에 연결하지 않음)</text><text x="30" y="372" text-anchor="start" font-size="14" fill="#8da3a0" xml:space="preserve" font-family="Consolas,DejaVu Sans Mono,monospace"># 백엔드 8001을 끄고 3초 뒤</text><text x="30" y="394" text-anchor="start" font-size="14" fill="#e5c07b" xml:space="preserve" font-family="Consolas,DejaVu Sans Mono,monospace">[Health] 127.0.0.1:8001 연결 실패 → 요청을 보내지 않음 (자동 제외)</text><text x="30" y="416" text-anchor="start" font-size="14" fill="#7fd6cf" xml:space="preserve" font-family="Consolas,DejaVu Sans Mono,monospace">$ curl -s http://localhost:8080/api/</text><text x="30" y="438" text-anchor="start" font-size="14" fill="#d8e2e0" xml:space="preserve" font-family="Consolas,DejaVu Sans Mono,monospace">백엔드 8003이 보낸 /api/ 응답</text></svg>
