<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-label="위: Forward Proxy가 클라이언트를 대신해 요청에 적힌 여러 서버로 요청을 보낸다. 아래: Reverse Proxy가 서버 쪽에서 요청을 받아 미리 정한 백엔드 서버로 전달한다." xmlns:c2pa="http://c2pa.org/manifest">
<rect width="100%" height="100%" fill="#ffffff"/>
<style>
text{font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;fill:#18272b}
.mono{font-family:Consolas,"DejaVu Sans Mono",monospace}
.muted{fill:#56686c}.c{fill:#0f7c78}.s{fill:#a8650c}.p{fill:#5b5fa8}
.box-c{fill:#dcefed;stroke:#0f7c78;stroke-width:1.5}
.box-s{fill:#f6e8d3;stroke:#a8650c;stroke-width:1.5}
.box-p{fill:#e5e6f5;stroke:#5b5fa8;stroke-width:1.5}
.bldg{fill:none;stroke:#c9d5d3;stroke-width:2}
.ln{stroke:#56686c;stroke-width:1.5;fill:none}
.ln-c{stroke:#0f7c78;stroke-width:2;fill:none}.ln-s{stroke:#a8650c;stroke-width:2;fill:none}.ln-p{stroke:#5b5fa8;stroke-width:2;fill:none}
.life{stroke:#c9d5d3;stroke-width:2;stroke-dasharray:5 6}
.ah-c{fill:#0f7c78}.ah-s{fill:#a8650c}.ah-p{fill:#5b5fa8}.ah-m{fill:#56686c}
</style>
      <defs>
        <marker id="fC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ah-c"/></marker>
        <marker id="fP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ah-p"/></marker>
      </defs>
      <text x="24" y="30" font-size="16" font-weight="700">Forward Proxy (Proxy) · 클라이언트를 대신해 요청을 보낸다</text>
      <rect x="24" y="48" width="390" height="126" rx="8" class="bldg" stroke-dasharray="6 5"/>
      <text x="38" y="164" font-size="12" class="muted">클라이언트 쪽 네트워크</text>
      <rect x="40" y="80" width="120" height="44" rx="22" class="box-c"/><text x="100" y="107" text-anchor="middle" font-size="14">클라이언트</text>
      <path d="M160,102 L236,102" class="ln-c" marker-end="url(#fC)"/>
      <rect x="240" y="72" width="150" height="60" rx="8" class="box-p"/>
      <text x="315" y="98" text-anchor="middle" font-size="14" font-weight="700">Forward Proxy</text>
      <text x="315" y="118" text-anchor="middle" font-size="12" class="muted">연결 ① 받고 ② 연결</text>
      <path d="M390,102 C520,102 540,68 656,68" class="ln-p" marker-end="url(#fP)"/>
      <path d="M390,102 C520,102 540,110 656,110" class="ln-p" marker-end="url(#fP)"/>
      <path d="M390,102 C520,102 540,152 656,152" class="ln-p" marker-end="url(#fP)"/>
      <rect x="660" y="50" width="200" height="36" rx="6" class="box-s"/><text x="760" y="73" text-anchor="middle" font-size="13">서버 A · naver.com</text>
      <rect x="660" y="92" width="200" height="36" rx="6" class="box-s"/><text x="760" y="115" text-anchor="middle" font-size="13">서버 B · example.com</text>
      <rect x="660" y="134" width="200" height="36" rx="6" class="box-s"/><text x="760" y="157" text-anchor="middle" font-size="13">서버 C · 임의의 서버</text>
      <text x="24" y="200" font-size="13" class="muted">목적지: 요청에 적힌 주소 · 서버는 TCP 연결 상대로 클라이언트 대신 프록시의 IP를 본다</text>

      <text x="24" y="250" font-size="16" font-weight="700">Reverse Proxy · 서버를 대신해 요청을 받는다</text>
      <rect x="40" y="300" width="120" height="44" rx="22" class="box-c"/><text x="100" y="327" text-anchor="middle" font-size="14">클라이언트</text>
      <rect x="300" y="268" width="576" height="126" rx="8" class="bldg" stroke-dasharray="6 5"/>
      <text x="314" y="386" font-size="12" class="muted">서버 쪽 (클라이언트에게는 서버 하나로 보인다)</text>
      <path d="M160,322 L336,322" class="ln-c" marker-end="url(#fC)"/>
      <rect x="340" y="292" width="160" height="60" rx="8" class="box-p"/>
      <text x="420" y="318" text-anchor="middle" font-size="14" font-weight="700">Reverse Proxy</text>
      <text x="420" y="338" text-anchor="middle" font-size="12" class="muted">연결 ① 받고 ② 연결</text>
      <path d="M500,322 C580,322 590,302 656,302" class="ln-p" marker-end="url(#fP)"/>
      <path d="M500,322 C580,322 590,350 656,350" class="ln-p" marker-end="url(#fP)"/>
      <rect x="660" y="282" width="200" height="40" rx="6" class="box-s"/><text x="760" y="307" text-anchor="middle" font-size="13">백엔드 서버 1 · 웹 서버</text>
      <rect x="660" y="330" width="200" height="40" rx="6" class="box-s"/><text x="760" y="355" text-anchor="middle" font-size="13">백엔드 서버 2 · 웹 서버</text>
      <text x="24" y="422" font-size="13" class="muted">목적지: 프록시 설정에 미리 정해 둔 백엔드 서버 · 클라이언트는 백엔드 서버가 있는지 모른다</text>
    <metadata><c2pa:manifest></c2pa:manifest></metadata></svg>