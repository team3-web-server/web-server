<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif"><title>전체 구조: 클라이언트, Reverse Proxy, 백엔드 웹 서버 세 대</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d64545"/></marker></defs><rect width="900" height="440" fill="#ffffff"/><text x="450" y="34" text-anchor="middle" font-size="19" fill="#222222" xml:space="preserve" font-weight="700">전체 구조 (proxy.conf 기본 설정)</text><rect x="30" y="180" width="150" height="90" rx="9" fill="#e8eef8" stroke="#5b7bb0" stroke-width="1.8"/><text x="105.0" y="221.0" text-anchor="middle" font-size="14" fill="#222222" xml:space="preserve" font-weight="700">클라이언트</text><text x="105.0" y="240.0" text-anchor="middle" font-size="12" fill="#555555" xml:space="preserve">브라우저, curl</text><rect x="270" y="70" width="270" height="340" rx="12" fill="#fff9e8" stroke="#c99a2e" stroke-width="1.8"/><text x="405" y="100" text-anchor="middle" font-size="16" fill="#222222" xml:space="preserve" font-weight="700">Reverse Proxy :8080</text><text x="405" y="121" text-anchor="middle" font-size="12" fill="#555555" xml:space="preserve">연결마다 스레드 (pthread)</text><rect x="295" y="140" width="220" height="54" rx="9" fill="#fff4d6" stroke="#c99a2e" stroke-width="1.8"/><text x="405.0" y="163.0" text-anchor="middle" font-size="14" fill="#222222" xml:space="preserve" font-weight="700">응답 캐시</text><text x="405.0" y="182.0" text-anchor="middle" font-size="12" fill="#555555" xml:space="preserve">/static/ 의 GET 200, 10초</text><rect x="295" y="206" width="220" height="54" rx="9" fill="#fff4d6" stroke="#c99a2e" stroke-width="1.8"/><text x="405.0" y="229.0" text-anchor="middle" font-size="14" fill="#222222" xml:space="preserve" font-weight="700">라운드로빈 + failover</text><text x="405.0" y="248.0" text-anchor="middle" font-size="12" fill="#555555" xml:space="preserve">살아 있는 백엔드를 차례대로</text><rect x="295" y="272" width="220" height="54" rx="9" fill="#fff4d6" stroke="#c99a2e" stroke-width="1.8"/><text x="405.0" y="295.0" text-anchor="middle" font-size="14" fill="#222222" xml:space="preserve" font-weight="700">연결 보관함</text><text x="405.0" y="314.0" text-anchor="middle" font-size="12" fill="#555555" xml:space="preserve">백엔드마다 4개까지</text><rect x="295" y="338" width="220" height="54" rx="9" fill="#fff4d6" stroke="#c99a2e" stroke-width="1.8"/><text x="405.0" y="361.0" text-anchor="middle" font-size="14" fill="#222222" xml:space="preserve" font-weight="700">헬스 체크</text><text x="405.0" y="380.0" text-anchor="middle" font-size="12" fill="#555555" xml:space="preserve">2초 쉬고 다시 connect</text><path d="M180,225 L268,225" stroke="#444444" stroke-width="1.8" fill="none" marker-end="url(#a)"/><text x="224" y="213" text-anchor="middle" font-size="12" fill="#555555" xml:space="preserve">keep-alive</text><rect x="690" y="80" width="180" height="80" rx="9" fill="#e6f4ea" stroke="#4a9564" stroke-width="1.8"/><text x="780.0" y="116.0" text-anchor="middle" font-size="14" fill="#222222" xml:space="preserve" font-weight="700">웹 서버 :8001</text><text x="780.0" y="135.0" text-anchor="middle" font-size="12" fill="#555555" xml:space="preserve">/api/</text><rect x="690" y="190" width="180" height="80" rx="9" fill="#e6f4ea" stroke="#4a9564" stroke-width="1.8"/><text x="780.0" y="226.0" text-anchor="middle" font-size="14" fill="#222222" xml:space="preserve" font-weight="700">웹 서버 :8003</text><text x="780.0" y="245.0" text-anchor="middle" font-size="12" fill="#555555" xml:space="preserve">/api/</text><rect x="690" y="300" width="180" height="80" rx="9" fill="#e6f4ea" stroke="#4a9564" stroke-width="1.8"/><text x="780.0" y="336.0" text-anchor="middle" font-size="14" fill="#222222" xml:space="preserve" font-weight="700">웹 서버 :8002</text><text x="780.0" y="355.0" text-anchor="middle" font-size="12" fill="#555555" xml:space="preserve">/static/</text><path d="M540,200 L688,125" stroke="#444444" stroke-width="1.8" fill="none" marker-end="url(#a)"/><path d="M540,233 L688,230" stroke="#444444" stroke-width="1.8" fill="none" marker-end="url(#a)"/><path d="M540,285 L688,335" stroke="#444444" stroke-width="1.8" fill="none" marker-end="url(#a)"/><text x="780" y="404" text-anchor="middle" font-size="12" fill="#555555" xml:space="preserve">각 웹 서버: 연결마다 fork</text><text x="780" y="422" text-anchor="middle" font-size="12" fill="#555555" xml:space="preserve">정적 파일 + CGI</text></svg>
