<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 490" width="1060" height="490" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif"><title>전체 구조: 정적 파일은 웹 서버가 읽어 보내고, /static/ 은 8002가 맡는다</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d64545"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a45"/></marker></defs><rect width="1060" height="490" fill="#ffffff"/><text x="530" y="34" text-anchor="middle" font-size="19" fill="#222222" xml:space="preserve" font-weight="700">전체 구조 (proxy.conf 기본 설정)</text><rect x="30" y="180" width="150" height="90" rx="9" fill="#e8eef8" stroke="#5b7bb0" stroke-width="1.8"/><text x="105.0" y="221.0" text-anchor="middle" font-size="14" fill="#222222" xml:space="preserve" font-weight="700">클라이언트</text><text x="105.0" y="240.0" text-anchor="middle" font-size="12" fill="#555555" xml:space="preserve">브라우저, curl</text><rect x="270" y="70" width="270" height="340" rx="12" fill="#fff9e8" stroke="#c99a2e" stroke-width="1.8"/><text x="405" y="100" text-anchor="middle" font-size="16" fill="#222222" xml:space="preserve" font-weight="700">Reverse Proxy :8080</text><text x="405" y="121" text-anchor="middle" font-size="12" fill="#555555" xml:space="preserve">연결마다 스레드 · 정적 파일은 읽지 않음</text><rect x="295" y="140" width="220" height="54" rx="9" fill="#fff4d6" stroke="#c99a2e" stroke-width="1.8"/><text x="405.0" y="163.0" text-anchor="middle" font-size="14" fill="#222222" xml:space="preserve" font-weight="700">응답 캐시</text><text x="405.0" y="182.0" text-anchor="middle" font-size="12" fill="#555555" xml:space="preserve">/static/ 의 GET 200 사본, 10초</text><rect x="295" y="206" width="220" height="54" rx="9" fill="#fff4d6" stroke="#c99a2e" stroke-width="1.8"/><text x="405.0" y="229.0" text-anchor="middle" font-size="14" fill="#222222" xml:space="preserve" font-weight="700">라운드로빈 + failover</text><text x="405.0" y="248.0" text-anchor="middle" font-size="12" fill="#555555" xml:space="preserve">살아 있는 백엔드를 차례대로</text><rect x="295" y="272" width="220" height="54" rx="9" fill="#fff4d6" stroke="#c99a2e" stroke-width="1.8"/><text x="405.0" y="295.0" text-anchor="middle" font-size="14" fill="#222222" xml:space="preserve" font-weight="700">연결 보관함</text><text x="405.0" y="314.0" text-anchor="middle" font-size="12" fill="#555555" xml:space="preserve">백엔드마다 4개까지</text><rect x="295" y="338" width="220" height="54" rx="9" fill="#fff4d6" stroke="#c99a2e" stroke-width="1.8"/><text x="405.0" y="361.0" text-anchor="middle" font-size="14" fill="#222222" xml:space="preserve" font-weight="700">헬스 체크</text><text x="405.0" y="380.0" text-anchor="middle" font-size="12" fill="#555555" xml:space="preserve">2초 쉬고 다시 connect</text><path d="M180,225 L268,225" stroke="#444444" stroke-width="1.8" fill="none" marker-end="url(#a)"/><text x="224" y="213" text-anchor="middle" font-size="12" fill="#555555" xml:space="preserve">keep-alive</text><rect x="640" y="80" width="180" height="80" rx="9" fill="#e6f4ea" stroke="#4a9564" stroke-width="1.8"/><text x="730.0" y="113" text-anchor="middle" font-size="14" fill="#222222" xml:space="preserve" font-weight="700">웹 서버 :8001</text><text x="730.0" y="133" text-anchor="middle" font-size="12" fill="#555555" xml:space="preserve">/api/ 담당</text><text x="730.0" y="150" text-anchor="middle" font-size="12" fill="#1f7a45" xml:space="preserve" font-weight="700">디스크에서 읽어 보냄</text><rect x="880" y="90" width="160" height="60" rx="4" fill="#f4f4f4" stroke="#999999" stroke-width="1.8"/><text x="960.0" y="115" text-anchor="middle" font-size="12" fill="#555555" xml:space="preserve">demo/proxy/backend1/</text><text x="960.0" y="135" text-anchor="middle" font-size="13" fill="#222222" xml:space="preserve" font-weight="700">api/index.html</text><path d="M878,120 L824,120" stroke="#1f7a45" stroke-width="1.8" fill="none" marker-end="url(#g)"/><text x="850" y="112" text-anchor="middle" font-size="11" fill="#1f7a45" xml:space="preserve">읽기</text><rect x="640" y="190" width="180" height="80" rx="9" fill="#e6f4ea" stroke="#4a9564" stroke-width="1.8"/><text x="730.0" y="223" text-anchor="middle" font-size="14" fill="#222222" xml:space="preserve" font-weight="700">웹 서버 :8003</text><text x="730.0" y="243" text-anchor="middle" font-size="12" fill="#555555" xml:space="preserve">/api/ 담당</text><text x="730.0" y="260" text-anchor="middle" font-size="12" fill="#1f7a45" xml:space="preserve" font-weight="700">디스크에서 읽어 보냄</text><rect x="880" y="200" width="160" height="60" rx="4" fill="#f4f4f4" stroke="#999999" stroke-width="1.8"/><text x="960.0" y="225" text-anchor="middle" font-size="12" fill="#555555" xml:space="preserve">demo/proxy/backend3/</text><text x="960.0" y="245" text-anchor="middle" font-size="13" fill="#222222" xml:space="preserve" font-weight="700">api/index.html</text><path d="M878,230 L824,230" stroke="#1f7a45" stroke-width="1.8" fill="none" marker-end="url(#g)"/><text x="850" y="222" text-anchor="middle" font-size="11" fill="#1f7a45" xml:space="preserve">읽기</text><rect x="640" y="300" width="180" height="80" rx="9" fill="#cfead8" stroke="#1f7a45" stroke-width="3.5"/><text x="730.0" y="333" text-anchor="middle" font-size="14" fill="#222222" xml:space="preserve" font-weight="700">웹 서버 :8002</text><text x="730.0" y="353" text-anchor="middle" font-size="12" fill="#555555" xml:space="preserve">/static/ 담당</text><text x="730.0" y="370" text-anchor="middle" font-size="12" fill="#1f7a45" xml:space="preserve" font-weight="700">디스크에서 읽어 보냄</text><rect x="880" y="310" width="160" height="60" rx="4" fill="#f4f4f4" stroke="#1f7a45" stroke-width="3.5"/><text x="960.0" y="335" text-anchor="middle" font-size="12" fill="#555555" xml:space="preserve">demo/proxy/backend2/</text><text x="960.0" y="355" text-anchor="middle" font-size="13" fill="#222222" xml:space="preserve" font-weight="700">static/index.html</text><path d="M878,340 L824,340" stroke="#1f7a45" stroke-width="3.5" fill="none" marker-end="url(#g)"/><text x="850" y="332" text-anchor="middle" font-size="11" fill="#1f7a45" xml:space="preserve">읽기</text><path d="M540,200 L638,125" stroke="#444444" stroke-width="1.8" fill="none" marker-end="url(#a)"/><path d="M540,233 L638,230" stroke="#444444" stroke-width="1.8" fill="none" marker-end="url(#a)"/><path d="M540,285 L638,335" stroke="#1f7a45" stroke-width="3.5" fill="none" marker-end="url(#g)"/><text x="591" y="332" text-anchor="middle" font-size="12" fill="#1f7a45" xml:space="preserve" font-weight="700">/static/</text><text x="730" y="404" text-anchor="middle" font-size="12" fill="#555555" xml:space="preserve">각 웹 서버: 연결마다 fork</text><text x="730" y="422" text-anchor="middle" font-size="12" fill="#555555" xml:space="preserve">정적 파일과 CGI 처리</text><text x="960" y="404" text-anchor="middle" font-size="12" fill="#555555" xml:space="preserve">웹 서버가 읽는 파일</text><rect x="30" y="438" width="1010" height="38" rx="8" fill="#eaf6ee"/><text x="535" y="462" text-anchor="middle" font-size="14" fill="#14532d" xml:space="preserve" font-weight="700">정적 파일은 웹 서버가 디스크에서 읽어 보냅니다. 프록시는 전달만 하고, 캐시에 있으면(10초) 보관한 사본을 보냅니다.</text></svg>
