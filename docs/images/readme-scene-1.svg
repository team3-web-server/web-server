<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif"><title>장면 1 느린 연결 하나가 모두를 기다리게 함</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d64545"/></marker></defs><rect width="600" height="400" fill="#ffffff"/><text x="300" y="32" text-anchor="middle" font-size="19" fill="#222222" xml:space="preserve" font-weight="700">① 느린 연결 하나가 모두를 기다리게 함</text><text x="300" y="56" text-anchor="middle" font-size="13" fill="#555555" xml:space="preserve">서버가 연결을 하나씩 처리한다면</text><rect x="10" y="70" width="580" height="320" rx="12" fill="#fafafa" stroke="#cccccc"/><rect x="30" y="100" width="150" height="60" rx="9" fill="#fff4d6" stroke="#c99a2e" stroke-width="1.8"/><text x="105.0" y="126.0" text-anchor="middle" font-size="14" fill="#222222" xml:space="preserve" font-weight="700">클라이언트 A</text><text x="105.0" y="145.0" text-anchor="middle" font-size="12" fill="#555555" xml:space="preserve">요청을 아주 천천히 보냄</text><rect x="30" y="190" width="150" height="60" rx="9" fill="#e8eef8" stroke="#5b7bb0" stroke-width="1.8"/><text x="105.0" y="216.0" text-anchor="middle" font-size="14" fill="#222222" xml:space="preserve" font-weight="700">클라이언트 B</text><text x="105.0" y="235.0" text-anchor="middle" font-size="12" fill="#555555" xml:space="preserve">대기 중</text><rect x="30" y="280" width="150" height="60" rx="9" fill="#e8eef8" stroke="#5b7bb0" stroke-width="1.8"/><text x="105.0" y="306.0" text-anchor="middle" font-size="14" fill="#222222" xml:space="preserve" font-weight="700">클라이언트 C</text><text x="105.0" y="325.0" text-anchor="middle" font-size="12" fill="#555555" xml:space="preserve">대기 중</text><rect x="390" y="170" width="170" height="100" rx="9" fill="#eeeeee" stroke="#777777" stroke-width="1.8"/><text x="475.0" y="207.0" text-anchor="middle" font-size="14" fill="#222222" xml:space="preserve" font-weight="700">웹 서버</text><text x="475.0" y="226.0" text-anchor="middle" font-size="12" fill="#555555" xml:space="preserve">A의 요청이</text><text x="475.0" y="245.0" text-anchor="middle" font-size="12" fill="#555555" xml:space="preserve">끝나기를 기다림</text><path d="M180,130 L388,195" stroke="#444444" stroke-width="1.8" fill="none" marker-end="url(#a)"/><path d="M180,220 L388,222" stroke="#d64545" stroke-width="1.8" fill="none" marker-end="url(#r)" stroke-dasharray="6 5"/><path d="M180,310 L388,250" stroke="#d64545" stroke-width="1.8" fill="none" marker-end="url(#r)" stroke-dasharray="6 5"/><text x="290" y="148" text-anchor="middle" font-size="12" fill="#555555" xml:space="preserve">처리 중</text><text x="300" y="370" text-anchor="middle" font-size="15" fill="#d64545" xml:space="preserve" font-weight="700">✗ B와 C는 A가 끝날 때까지 응답을 못 받음</text></svg>
