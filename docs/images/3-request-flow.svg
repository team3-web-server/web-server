<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-label="클라이언트와 서버 사이에서 요청 하나가 처리되는 6단계 순서도" xmlns:c2pa="http://c2pa.org/manifest">
<rect width="100%" height="100%" fill="#ffffff"/>
<style>
text{font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;fill:#18272b}
.mono{font-family:Consolas,"DejaVu Sans Mono",monospace}
.muted{fill:#56686c}.c{fill:#0f7c78}.s{fill:#a8650c}.p{fill:#5b5fa8}
.box-c{fill:#dcefed;stroke:#0f7c78;stroke-width:1.5}
.box-s{fill:#f6e8d3;stroke:#a8650c;stroke-width:1.5}
.box-p{fill:#e5e6f5;stroke:#5b5fa8;stroke-width:1.5}
.bldg{fill:none;stroke:#c9d5d3;stroke-width:2}
.ln{stroke:#56686c;stroke-width:1.5;fill:none}
.ln-c{stroke:#0f7c78;stroke-width:2;fill:none}.ln-s{stroke:#a8650c;stroke-width:2;fill:none}.ln-p{stroke:#5b5fa8;stroke-width:2;fill:none}
.life{stroke:#c9d5d3;stroke-width:2;stroke-dasharray:5 6}
.ah-c{fill:#0f7c78}.ah-s{fill:#a8650c}.ah-p{fill:#5b5fa8}.ah-m{fill:#56686c}
</style>
      <defs>
        <marker id="bC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ah-c"/></marker>
        <marker id="bS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ah-s"/></marker>
      </defs>
      <rect x="70" y="20" width="160" height="40" rx="20" class="box-c"/><text x="150" y="46" text-anchor="middle" font-weight="700">클라이언트</text>
      <rect x="610" y="20" width="200" height="40" rx="8" class="box-s"/><text x="710" y="46" text-anchor="middle" font-weight="700">우리 웹 서버</text>
      <line x1="150" y1="60" x2="150" y2="520" class="life"/>
      <line x1="710" y1="60" x2="710" y2="520" class="life"/>

      <!-- 1 -->
      <rect x="560" y="80" width="300" height="56" rx="6" class="box-s"/>
      <text x="576" y="104" font-size="14" font-weight="700">① 듣기 소켓 준비</text>
      <text x="576" y="125" font-size="13" class="mono s">socket → bind → listen</text>
      <!-- 2 -->
      <path d="M150,176 L556,176" class="ln-c" marker-end="url(#bC)"/>
      <text x="350" y="166" text-anchor="middle" font-size="13" class="c">TCP 연결 요청 (connect)</text>
      <rect x="560" y="152" width="300" height="50" rx="6" class="box-s"/>
      <text x="576" y="174" font-size="14" font-weight="700">② 연결 수락 → 연결 소켓 생성</text>
      <text x="576" y="193" font-size="13" class="mono s">accept</text>
      <!-- 3 -->
      <path d="M150,252 L706,252" class="ln-c" marker-end="url(#bC)"/>
      <text x="170" y="240" font-size="14" font-weight="700">③ HTTP 요청 전송 (write) · 서버가 읽음 (read)</text>
      <text x="170" y="274" font-size="13" class="mono c">GET /index.html HTTP/1.1</text>
      <!-- 4 -->
      <rect x="560" y="300" width="300" height="50" rx="6" class="box-s"/>
      <text x="576" y="322" font-size="14" font-weight="700">④ 요청 파싱</text>
      <text x="576" y="341" font-size="13" class="s mono">method=GET, path=/index.html</text>
      <!-- 5 -->
      <rect x="560" y="368" width="300" height="56" rx="6" class="box-s"/>
      <text x="576" y="392" font-size="14" font-weight="700">⑤ 파일 읽고 HTTP 응답 생성</text>
      <text x="576" y="412" font-size="13" class="s">없으면 404 Not Found</text>
      <!-- 6 -->
      <path d="M706,470 L154,470" class="ln-s" marker-end="url(#bS)"/>
      <text x="690" y="458" text-anchor="end" font-size="14" font-weight="700">⑥ 응답 전송 (write) 후 연결 종료 (close)</text>
      <text x="690" y="492" text-anchor="end" font-size="13" class="mono s">HTTP/1.1 200 OK + 파일 내용</text>
      <text x="710" y="516" text-anchor="middle" font-size="12" class="muted mono">close</text>
    <metadata><c2pa:manifest></c2pa:manifest></metadata></svg>