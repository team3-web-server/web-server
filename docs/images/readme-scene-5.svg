<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif"><title>장면 5 같은 응답을 매번 다시 만듦</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d64545"/></marker></defs><rect width="600" height="400" fill="#ffffff"/><text x="300" y="32" text-anchor="middle" font-size="19" fill="#222222" xml:space="preserve" font-weight="700">⑤ 같은 응답을 매번 다시 만듦</text><text x="300" y="56" text-anchor="middle" font-size="13" fill="#555555" xml:space="preserve">프록시가 받은 응답을 기억하지 않는다면</text><rect x="10" y="70" width="580" height="320" rx="12" fill="#fafafa" stroke="#cccccc"/><rect x="30" y="160" width="130" height="110" rx="9" fill="#e8eef8" stroke="#5b7bb0" stroke-width="1.8"/><text x="95.0" y="202.0" text-anchor="middle" font-size="14" fill="#222222" xml:space="preserve" font-weight="700">클라이언트</text><text x="95.0" y="221.0" text-anchor="middle" font-size="12" fill="#555555" xml:space="preserve">같은 파일을</text><text x="95.0" y="240.0" text-anchor="middle" font-size="12" fill="#555555" xml:space="preserve">세 번 요청</text><rect x="235" y="160" width="130" height="110" rx="9" fill="#fff4d6" stroke="#c99a2e" stroke-width="1.8"/><text x="300.0" y="211.0" text-anchor="middle" font-size="14" fill="#222222" xml:space="preserve" font-weight="700">프록시</text><text x="300.0" y="230.0" text-anchor="middle" font-size="12" fill="#555555" xml:space="preserve">그대로 전달</text><rect x="440" y="160" width="130" height="110" rx="9" fill="#eeeeee" stroke="#777777" stroke-width="1.8"/><text x="505.0" y="202.0" text-anchor="middle" font-size="14" fill="#222222" xml:space="preserve" font-weight="700">백엔드</text><text x="505.0" y="221.0" text-anchor="middle" font-size="12" fill="#555555" xml:space="preserve">같은 파일을</text><text x="505.0" y="240.0" text-anchor="middle" font-size="12" fill="#555555" xml:space="preserve">세 번 읽음</text><path d="M160,180 L233,180" stroke="#444444" stroke-width="1.8" fill="none" marker-end="url(#a)"/><path d="M365,180 L438,180" stroke="#444444" stroke-width="1.8" fill="none" marker-end="url(#a)"/><path d="M160,215 L233,215" stroke="#444444" stroke-width="1.8" fill="none" marker-end="url(#a)"/><path d="M365,215 L438,215" stroke="#444444" stroke-width="1.8" fill="none" marker-end="url(#a)"/><path d="M160,250 L233,250" stroke="#444444" stroke-width="1.8" fill="none" marker-end="url(#a)"/><path d="M365,250 L438,250" stroke="#444444" stroke-width="1.8" fill="none" marker-end="url(#a)"/><text x="300" y="370" text-anchor="middle" font-size="15" fill="#d64545" xml:space="preserve" font-weight="700">✗ 바뀌지 않은 파일인데 백엔드가 세 번 일함</text></svg>
