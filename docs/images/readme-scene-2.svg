<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif"><title>장면 2 요청마다 연결을 새로 맺음</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d64545"/></marker></defs><rect width="600" height="400" fill="#ffffff"/><text x="300" y="32" text-anchor="middle" font-size="19" fill="#222222" xml:space="preserve" font-weight="700">② 요청마다 연결을 새로 맺음</text><text x="300" y="56" text-anchor="middle" font-size="13" fill="#555555" xml:space="preserve">응답할 때마다 서버가 연결을 닫는다면</text><rect x="10" y="70" width="580" height="320" rx="12" fill="#fafafa" stroke="#cccccc"/><rect x="30" y="110" width="130" height="230" rx="9" fill="#e8eef8" stroke="#5b7bb0" stroke-width="1.8"/><text x="95.0" y="221.0" text-anchor="middle" font-size="14" fill="#222222" xml:space="preserve" font-weight="700">클라이언트</text><text x="95.0" y="240.0" text-anchor="middle" font-size="12" fill="#555555" xml:space="preserve">요청 3개</text><rect x="440" y="110" width="130" height="230" rx="9" fill="#eeeeee" stroke="#777777" stroke-width="1.8"/><text x="505.0" y="221.0" text-anchor="middle" font-size="14" fill="#222222" xml:space="preserve" font-weight="700">서버</text><text x="505.0" y="240.0" text-anchor="middle" font-size="12" fill="#555555" xml:space="preserve"></text><path d="M160,130 L438,130" stroke="#444444" stroke-width="1.8" fill="none" marker-end="url(#a)"/><text x="300" y="123" text-anchor="middle" font-size="12" fill="#222222" xml:space="preserve">요청 1: connect (3-way handshake)</text><path d="M438,156 L162,156" stroke="#444444" stroke-width="1.8" fill="none" marker-end="url(#a)"/><text x="300" y="174" text-anchor="middle" font-size="12" fill="#555555" xml:space="preserve">응답 → close</text><path d="M160,210 L438,210" stroke="#444444" stroke-width="1.8" fill="none" marker-end="url(#a)"/><text x="300" y="203" text-anchor="middle" font-size="12" fill="#222222" xml:space="preserve">요청 2: connect (3-way handshake)</text><path d="M438,236 L162,236" stroke="#444444" stroke-width="1.8" fill="none" marker-end="url(#a)"/><text x="300" y="254" text-anchor="middle" font-size="12" fill="#555555" xml:space="preserve">응답 → close</text><path d="M160,290 L438,290" stroke="#444444" stroke-width="1.8" fill="none" marker-end="url(#a)"/><text x="300" y="283" text-anchor="middle" font-size="12" fill="#222222" xml:space="preserve">요청 3: connect (3-way handshake)</text><path d="M438,316 L162,316" stroke="#444444" stroke-width="1.8" fill="none" marker-end="url(#a)"/><text x="300" y="334" text-anchor="middle" font-size="12" fill="#555555" xml:space="preserve">응답 → close</text><text x="300" y="370" text-anchor="middle" font-size="15" fill="#d64545" xml:space="preserve" font-weight="700">✗ 요청 3개에 TCP 연결도 3번 맺고 끊음</text></svg>
